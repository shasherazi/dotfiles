decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 0
    blur {
      enabled = yes
      size = 5
      ignore_opacity = true
      passes = 3
      new_optimizations = on
    }

    active_opacity = 0.85
    inactive_opacity = 0.85
    dim_inactive = true
    dim_strength = 0.2
}

windowrule = match:class .*, idle_inhibit fullscreen # for lutris games basically
windowrule = match:class ^(Emulator)$, no_dim on # for android studio emulators
windowrule = match:title ^(Picture-in-Picture)$, no_dim on # for youtube pip

windowrule = match:class ^(Alacritty)$, float on
windowrule = match:class ^(kitty)$, float on
windowrule = match:class ^(kitty)$, size (monitor_w*0.8) (monitor_h*0.8)
windowrule = match:class ^(kitty)$, center on

windowrule = match:class ^(firefox)$, opaque on
windowrule = match:class ^(floorp)$, opaque on
windowrule = match:class ^(waterfox)$, opaque on
windowrule = match:class ^(LibreWolf)$, opaque on
windowrule = match:class ^(Chromium)$, opaque on
windowrule = match:class ^(blender)$, opaque on
windowrule = match:class ^(brave-browser)$, opaque on
windowrule = match:class ^(vivaldi-stable)$, opaque on
windowrule = match:class ^(Gimp-2.10)$, opaque on
windowrule = match:class ^(krita)$, opaque on
windowrule = match:class ^(com.stremio.stremio)$, opaque on
windowrule = match:class ^(Stremio)$, opaque on
windowrule = match:class ^(mpv)$, opaque on

windowrule = match:class ^(firefox)$, workspace 3
windowrule = match:class ^(floorp)$, workspace 3
windowrule = match:class ^(waterfox)$, workspace 3
windowrule = match:class ^(LibreWolf)$, workspace 3
windowrule = match:class ^(Brave-browser)$, workspace 3
windowrule = match:class ^(vivaldi-stable)$, workspace 3
windowrule = match:class ^(Chromium)$, workspace 3
windowrule = match:class ^(Google-chrome)$, workspace 3
windowrule = match:class ^(Spotify)$, workspace 5
windowrule = match:class ^(discord)$, workspace 6
windowrule = match:class ^(vesktop)$, workspace 6
windowrule = match:class ^(WebCord)$, workspace 6
windowrule = match:class ^(Element)$, workspace 6
windowrule = match:class ^(Slack)$, workspace 7
windowrule = match:class ^(zoom)$, workspace 8
windowrule = match:class ^(thunderbird)$, workspace 9

windowrule = match:class ^(jetbrains-.*)$, match:title ^(win[0-9]+)$, float on
windowrule = match:class ^(jetbrains-.*)$, match:title ^(win[0-9]+)$, no_focus on
